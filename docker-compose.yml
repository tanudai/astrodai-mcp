services:
  astrodai-ephemeris:
    build: .
    image: tanudai/astrodai-ephemeris:latest
    container_name: astrodai-ephemeris
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - ASTRODAI_MCP_URL=https://astrodai.com/mcp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
